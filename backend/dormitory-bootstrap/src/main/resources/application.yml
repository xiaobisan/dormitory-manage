server:
  port: 8080

spring:
  application:
    name: dormitory-manage

  # ===== 默认本地演示：H2 内存库（零配置，启动自动建表+灌种子数据）=====
  datasource:
    url: jdbc:h2:mem:dormitory;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      # 先建表，再灌种子数据（按文件顺序）
      schema-locations: classpath:h2/schema.sql
      data-locations: classpath:h2/data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 业务自定义 =====
dormitory:
  jwt:
    # 演示用密钥，正式环境务必替换
    secret: dormitory-manage-secret-key-please-change-0123456789
    expire-ms: 7200000
  security:
    # 额外放行路径（逗号分隔），默认 /api/auth/** 已放行
    permit: /api/auth/login,/api/auth/register
  # Redis 可选：本地无 Redis 默认关闭；启用时设 true 并配置 spring.redis
  redis:
    enabled: false

logging:
  level:
    cn.dormitory: debug
    com.baomidou.mybatisplus: info

# ===== 切换真实 MySQL（答辩/生产）：注释上面的 H2，启用下面这段并改 spring.datasource =====
